# ==========================================
# Application General Settings
# ==========================================
spring.application.name=SchemaSync
server.port=${PORT:8080}

# ==========================================
# Database (PostgreSQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Security & JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Apache Kafka Core Configuration
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Kafka Security & SSL Properties (Required for Cloud Providers like Aiven)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.properties.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:}
spring.kafka.properties.ssl.truststore.certificates=${KAFKA_SSL_TRUSTSTORE_CERTIFICATES:}

# ==========================================
# Kafka Producer Configuration
# ==========================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ==========================================
# Redis Configuration
# ==========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:default}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=1000ms

# ==========================================
# External APIs (Google Gemini)
# ==========================================
gemini.api-key=${GEMINI_API_KEY}
gemini.model-name=${GEMINI_MODEL_NAME:gemini-flash-latest}

# ==========================================
# Kafka Consumer Configuration
# ==========================================
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:schemasync-consumer-group-v5-1}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Fetch only 5 records per poll. At 4 seconds per record (15/min),
# a batch takes 20 seconds to process, well within Kafka's default 5-minute timeout.
spring.kafka.consumer.max-poll-records=10
spring.kafka.properties.max.poll.interval.ms=300000